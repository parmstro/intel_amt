---
# Comprehensive test of ALL modules on ALL 5 hosts
- name: Test ALL AMT modules - CORRECTED
  hosts: management_node
  gather_facts: false

  tasks:
    - name: Load vault credentials
      ansible.builtin.include_vars:
        dir: vault
        ignore_unknown_extensions: true
        extensions:
          - yml
          - yaml
      no_log: true
      ignore_errors: true

    - name: Verify credentials
      ansible.builtin.assert:
        that:
          - amt_username is defined
          - amt_password is defined

    - name: "TEST 1: amt_event_log - Query event logs"
      parmstro.intel_amt.amt_event_log:
        host: "{{ item.host }}"
        username: "{{ item.username }}"
        password: "{{ item.password }}"
        port: "{{ item.port }}"
        use_tls: "{{ item.use_tls }}"
      loop: "{{ amt_fleet }}"
      loop_control:
        label: "{{ item.name }}"
      register: event_log_results
      ignore_errors: true

    - name: Display event log test results
      ansible.builtin.debug:
        msg: "{{ item.item.name }}: {{ 'PASS - ' + (item.events | length | string) + ' events' if not item.failed else 'FAIL - ' + (item.msg | default('error')) }}"
      loop: "{{ event_log_results.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: "TEST 2: amt_host_status - Query status"
      parmstro.intel_amt.amt_host_status:
        host: "{{ item.host }}"
        username: "{{ item.username }}"
        password: "{{ item.password }}"
        port: "{{ item.port }}"
        use_tls: "{{ item.use_tls }}"
      loop: "{{ amt_fleet }}"
      loop_control:
        label: "{{ item.name }}"
      register: status_results
      ignore_errors: true

    - name: Display host status test results
      ansible.builtin.debug:
        msg: "{{ item.item.name }}: {{ 'PASS - ' + (item.power_state | default('unknown')) if not item.failed else 'FAIL - ' + (item.msg | default('error')) }}"
      loop: "{{ status_results.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: "TEST 3: amt_power - Query power state"
      parmstro.intel_amt.amt_power:
        host: "{{ item.host }}"
        username: "{{ item.username }}"
        password: "{{ item.password }}"
        port: "{{ item.port }}"
        use_tls: "{{ item.use_tls }}"
        state: query
      loop: "{{ amt_fleet }}"
      loop_control:
        label: "{{ item.name }}"
      register: power_results
      ignore_errors: true

    - name: Display power test results
      ansible.builtin.debug:
        msg: "{{ item.item.name }}: {{ 'PASS - ' + (item.power_state | default('unknown')) if not item.failed else 'FAIL - ' + (item.msg | default('error')) }}"
      loop: "{{ power_results.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: "TEST 4: amt_system_settings - Query hostname (no state param)"
      parmstro.intel_amt.amt_system_settings:
        host: "{{ item.host }}"
        username: "{{ item.username }}"
        password: "{{ item.password }}"
        port: "{{ item.port }}"
        use_tls: "{{ item.use_tls }}"
      loop: "{{ amt_fleet }}"
      loop_control:
        label: "{{ item.name }}"
      register: system_results
      ignore_errors: true

    - name: Display system settings test results
      ansible.builtin.debug:
        msg: "{{ item.item.name }}: {{ 'PASS - ' + (item.hostname | default('unknown')) if not item.failed else 'FAIL - ' + (item.msg | default('error')) }}"
      loop: "{{ system_results.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: "TEST 5: amt_power_policy - Query policy (no state param)"
      parmstro.intel_amt.amt_power_policy:
        host: "{{ item.host }}"
        username: "{{ item.username }}"
        password: "{{ item.password }}"
        port: "{{ item.port }}"
        use_tls: "{{ item.use_tls }}"
      loop: "{{ amt_fleet }}"
      loop_control:
        label: "{{ item.name }}"
      register: policy_results
      ignore_errors: true

    - name: Display power policy test results
      ansible.builtin.debug:
        msg: "{{ item.item.name }}: {{ 'PASS - idle=' + (item.idle_timeout | default('unknown') | string) if not item.failed else 'FAIL - ' + (item.msg | default('error')) }}"
      loop: "{{ policy_results.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: "TEST 6: amt_network_settings - Query network (no state param)"
      parmstro.intel_amt.amt_network_settings:
        host: "{{ item.host }}"
        username: "{{ item.username }}"
        password: "{{ item.password }}"
        port: "{{ item.port }}"
        use_tls: "{{ item.use_tls }}"
      loop: "{{ amt_fleet }}"
      loop_control:
        label: "{{ item.name }}"
      register: network_results
      ignore_errors: true

    - name: Display network settings test results
      ansible.builtin.debug:
        msg: "{{ item.item.name }}: {{ 'PASS - ' + (item.ip_address | default('unknown')) if not item.failed else 'FAIL - ' + (item.msg | default('error')) }}"
      loop: "{{ network_results.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: "TEST 7: amt_log_clear - Clear log on c1s2n5"
      parmstro.intel_amt.amt_log_clear:
        host: "{{ amt_fleet[4].host }}"
        username: "{{ amt_fleet[4].username }}"
        password: "{{ amt_fleet[4].password }}"
        port: "{{ amt_fleet[4].port }}"
        use_tls: "{{ amt_fleet[4].use_tls }}"
      register: clear_result
      ignore_errors: true

    - name: Display log clear test result
      ansible.builtin.debug:
        msg: "amt_log_clear: {{ 'PASS' if not clear_result.failed else 'FAIL - ' + (clear_result.msg | default('error')) }}"

    - name: "TEST 8: amt_user - Verify Enterprise Mode error"
      parmstro.intel_amt.amt_user:
        host: "{{ amt_fleet[0].host }}"
        username: "{{ amt_fleet[0].username }}"
        password: "{{ amt_fleet[0].password }}"
        port: "{{ amt_fleet[0].port }}"
        use_tls: "{{ amt_fleet[0].use_tls }}"
        target_user: admin
        new_password: "TestPassword123!"
        state: password_changed
      register: user_result
      ignore_errors: true

    - name: Display user module test result
      ansible.builtin.debug:
        msg: "amt_user: {{ 'PASS - Enterprise Mode error shown' if user_result.failed and 'Enterprise Mode' in user_result.msg else 'FAIL - unexpected behavior' }}"

    # FINAL SUMMARY
    - name: Calculate test summary
      ansible.builtin.set_fact:
        test_summary:
          amt_event_log:
            passed: "{{ event_log_results.results | rejectattr('failed', 'defined') | list | length }}"
            failed: "{{ event_log_results.results | selectattr('failed', 'defined') | list | length }}"
            total: "{{ amt_fleet | length }}"
          amt_host_status:
            passed: "{{ status_results.results | rejectattr('failed', 'defined') | list | length }}"
            failed: "{{ status_results.results | selectattr('failed', 'defined') | list | length }}"
            total: "{{ amt_fleet | length }}"
          amt_power:
            passed: "{{ power_results.results | rejectattr('failed', 'defined') | list | length }}"
            failed: "{{ power_results.results | selectattr('failed', 'defined') | list | length }}"
            total: "{{ amt_fleet | length }}"
          amt_system_settings:
            passed: "{{ system_results.results | rejectattr('failed', 'defined') | list | length }}"
            failed: "{{ system_results.results | selectattr('failed', 'defined') | list | length }}"
            total: "{{ amt_fleet | length }}"
          amt_power_policy:
            passed: "{{ policy_results.results | rejectattr('failed', 'defined') | list | length }}"
            failed: "{{ policy_results.results | selectattr('failed', 'defined') | list | length }}"
            total: "{{ amt_fleet | length }}"
          amt_network_settings:
            passed: "{{ network_results.results | rejectattr('failed', 'defined') | list | length }}"
            failed: "{{ network_results.results | selectattr('failed', 'defined') | list | length }}"
            total: "{{ amt_fleet | length }}"
          amt_log_clear:
            status: "{{ 'PASS' if not clear_result.failed else 'FAIL' }}"
          amt_user:
            status: "{{ 'PASS' if user_result.failed and 'Enterprise Mode' in user_result.msg else 'FAIL' }}"

    - name: Display comprehensive test summary
      ansible.builtin.debug:
        msg:
          - "============================================"
          - "COMPREHENSIVE MODULE TEST RESULTS"
          - "============================================"
          - "amt_event_log: {{ test_summary.amt_event_log.passed }}/{{ test_summary.amt_event_log.total }} PASS"
          - "amt_host_status: {{ test_summary.amt_host_status.passed }}/{{ test_summary.amt_host_status.total }} PASS"
          - "amt_power: {{ test_summary.amt_power.passed }}/{{ test_summary.amt_power.total }} PASS"
          - "amt_system_settings: {{ test_summary.amt_system_settings.passed }}/{{ test_summary.amt_system_settings.total }} PASS"
          - "amt_power_policy: {{ test_summary.amt_power_policy.passed }}/{{ test_summary.amt_power_policy.total }} PASS"
          - "amt_network_settings: {{ test_summary.amt_network_settings.passed }}/{{ test_summary.amt_network_settings.total }} PASS"
          - "amt_log_clear: {{ test_summary.amt_log_clear.status }}"
          - "amt_user: {{ test_summary.amt_user.status }} (Enterprise Mode check)"
          - "============================================"
          - "Total modules: 8"
          - "Total hosts tested: {{ amt_fleet | length }}"
          - "============================================"
