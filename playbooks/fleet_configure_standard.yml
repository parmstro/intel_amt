---
# Apply standard configuration to entire AMT fleet
# Runs on: management_node

- name: Configure AMT Fleet with Standard Settings
  hosts: management_node
  gather_facts: false

  tasks:
    - name: Load vault credentials
      ansible.builtin.include_vars:
        dir: ../vault
        ignore_unknown_extensions: true
        extensions:
          - yml
          - yaml
      no_log: true

    - name: Display configuration plan
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "AMT Fleet Standard Configuration"
          - "=========================================="
          - "Systems: {{ amt_fleet | length }}"
          - "Domain: {{ amt_standard_config.domain_name }}"
          - "Idle timeout: {{ amt_standard_config.idle_timeout }}s"
          - "Link policy: {{ amt_standard_config.link_policy }}"
          - "=========================================="

    - name: Configure system settings on each system
      parmstro.intel_amt.amt_system_settings:
        host: "{{ item.host }}"
        username: "{{ item.username }}"
        password: "{{ item.password }}"
        port: "{{ item.port }}"
        use_tls: "{{ item.use_tls }}"
        system_name: "{{ item.name }}"
        domain_name: "{{ amt_standard_config.domain_name }}"
      loop: "{{ amt_fleet }}"
      loop_control:
        label: "{{ item.name }}"
      register: system_config_results
      ignore_errors: "{{ amt_fleet_continue_on_error }}"
      throttle: "{{ amt_fleet_parallel_limit }}"

    - name: Configure power policy on each system
      parmstro.intel_amt.amt_power_policy:
        host: "{{ item.host }}"
        username: "{{ item.username }}"
        password: "{{ item.password }}"
        port: "{{ item.port }}"
        use_tls: "{{ item.use_tls }}"
        idle_timeout: "{{ amt_standard_config.idle_timeout }}"
        link_policy: "{{ amt_standard_config.link_policy }}"
      loop: "{{ amt_fleet }}"
      loop_control:
        label: "{{ item.name }}"
      register: power_policy_results
      ignore_errors: "{{ amt_fleet_continue_on_error }}"
      throttle: "{{ amt_fleet_parallel_limit }}"

    - name: Display configuration summary
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "Configuration Summary"
          - "=========================================="
          - "System Settings:"
          - "  Changed: {{ system_config_results.results | selectattr('changed', 'equalto', true) | list | length }}"
          - "  Unchanged: {{ system_config_results.results | selectattr('changed', 'equalto', false) | list | length }}"
          - ""
          - "Power Policy:"
          - "  Changed: {{ power_policy_results.results | selectattr('changed', 'equalto', true) | list | length }}"
          - "  Unchanged: {{ power_policy_results.results | selectattr('changed', 'equalto', false) | list | length }}"
          - "=========================================="
