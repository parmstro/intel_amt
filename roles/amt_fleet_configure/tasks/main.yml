---
# Fleet configuration management - aggregator pattern

- name: Validate amt_fleet
  ansible.builtin.assert:
    that:
      - amt_fleet is defined
      - amt_fleet | length > 0
    fail_msg: "amt_fleet must be defined in inventory"

- name: Configure system settings on fleet
  parmstro.intel_amt.amt_system_settings:
    host: "{{ item.host }}"
    username: "{{ item.username }}"
    password: "{{ item.password }}"
    port: "{{ item.port | default(16992) }}"
    use_tls: "{{ item.use_tls | default(false) }}"
    verify_ssl: "{{ item.verify_ssl | default(false) }}"
    system_name: "{{ item.system_name | default(omit) }}"
    domain_name: "{{ item.domain_name | default(omit) }}"
  loop: "{{ amt_fleet }}"
  loop_control:
    label: "{{ item.name }}"
  register: amt_fleet_configure_results
  ignore_errors: "{{ amt_fleet_continue_on_error }}"
  throttle: "{{ amt_fleet_parallel_limit }}"

- name: Display configuration summary
  when: amt_fleet_show_summary
  ansible.builtin.debug:
    msg: "Fleet Configure: {{ amt_fleet_configure_results.results | rejectattr('failed', 'defined') | list | length }}/{{ amt_fleet | length }} successful"
