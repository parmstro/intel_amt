---
# Fleet power management - aggregator pattern

- name: Validate amt_fleet
  ansible.builtin.assert:
    that:
      - amt_fleet is defined
      - amt_fleet | length > 0
    fail_msg: "amt_fleet must be defined in inventory"

- name: Validate required power operation state
  ansible.builtin.assert:
    that:
      - amt_fleet_power_state is defined
      - amt_fleet_power_state in ['on', 'off', 'cycle', 'reset', 'query']
    fail_msg: "amt_fleet_power_state must be one of on, off, cycle, reset, query"

- name: Execute power operation on fleet
  parmstro.intel_amt.amt_power:
    host: "{{ item.host }}"
    username: "{{ item.username }}"
    password: "{{ item.password }}"
    port: "{{ item.port | default(16992) }}"
    use_tls: "{{ item.use_tls | default(false) }}"
    verify_ssl: "{{ item.verify_ssl | default(false) }}"
    state: "{{ amt_fleet_power_state }}"
  loop: "{{ amt_fleet }}"
  loop_control:
    label: "{{ item.name }}"
  register: amt_fleet_power_results
  ignore_errors: "{{ amt_fleet_continue_on_error }}"
  throttle: "{{ amt_fleet_parallel_limit }}"

- name: Aggregate fleet results
  ansible.builtin.set_fact:
    amt_fleet_summary:
      total: "{{ amt_fleet_power_results.results | length }}"
      successful: "{{ amt_fleet_power_results.results | rejectattr('failed', 'defined') | list | length }}"
      failed: "{{ amt_fleet_power_results.results | selectattr('failed', 'defined') | list | length }}"

- name: Display fleet summary
  when: amt_fleet_show_summary
  ansible.builtin.debug:
    msg:
      - "Fleet Power: {{ amt_fleet_summary.successful }}/{{ amt_fleet_summary.total }} successful"
